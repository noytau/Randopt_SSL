# Dev-quick config for STS-B (tiny data for pipeline testing)

model: bert_large
task: stsb

task_config:
  max_length: 128
  max_train_samples: 50
  max_val_samples: 20
  max_test_samples: 20
  batch_size: 4
  num_workers: 0

methods:
  - linear_probe
  - finetune
  - randopt

head_lr: 0.001
head_epochs: 2

lr_encoder: 0.00001
lr_head: 0.001
ft_epochs: 1

sigma: 0.005
n_candidates: 5
top_k: 2
n_rounds: 1

seed: 42
device: auto
output_dir: results/dev_quick_stsb
