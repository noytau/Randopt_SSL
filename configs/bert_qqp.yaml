# BERT-Large × QQP (Quora Question Pairs)
# Binary: duplicate question pair (1) vs. not (0)
# 363,849 train / 40,430 val — large dataset
# Primary metric: F1

model: bert_large
task: qqp

task_config:
  max_length: 128
  max_train_samples: null        # use all 363,849
  max_val_samples: null          # use all 40,430
  max_test_samples: null
  batch_size: 32
  num_workers: 2

methods:
  - linear_probe
  - finetune
  - randopt

# Linear Probe config
head_lr: 0.001
head_epochs: 10
weight_decay: 0.0001

# Fine-tuning config
lr_encoder: 0.00001
lr_head: 0.001
ft_epochs: 3
max_grad_norm: 1.0

# RandOpt config — paper-style sigma set Sigma
sigma_set: [0.001, 0.003, 0.005, 0.01, 0.03]
n_candidates: 100
top_k: 5
n_rounds: 1

seed: 42
device: auto
output_dir: results/bert_qqp
