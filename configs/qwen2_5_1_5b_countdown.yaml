# Qwen2.5-1.5B-Instruct × Countdown
# Neural Thickets paper replication — mid-size model

model: qwen2_5_1_5b
task: countdown

task_config:
  max_train_samples: 500
  max_val_samples: 200
  max_test_samples: 500
  batch_size: 16        # 1.5B fp16 ~3 GB + KV cache → fits 24 GB at bs=16
  num_workers: 0
  use_synthetic: false

methods:
  - passatone
  - majority_vote
  - sft
  - randopt

# RandOpt config
sigma_set: [0.001, 0.003, 0.005, 0.01, 0.03]
n_candidates: 3000
top_k: 50
n_rounds: 1

max_new_tokens: 512

seed: 42
device: auto
output_dir: results/qwen2_5_1_5b_countdown
