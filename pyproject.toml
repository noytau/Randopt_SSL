[project]
name = "randopt-benchmark"
version = "0.1.0"
description = "RandOpt vs Fine-tuning benchmark across SSL foundation models"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0",
    "transformers>=4.40",
    "datasets>=2.18",
    "torchaudio>=2.0",
    "numpy>=1.24",
    "pyyaml>=6.0",
    "matplotlib>=3.7",
    "seaborn>=0.12",
    "pandas>=2.0",
    "tqdm>=4.65",
    "jiwer>=3.0",           # WER computation for ASR
    "evaluate>=0.4",        # HuggingFace metrics
    "scikit-learn>=1.3",
    "tabulate>=0.9",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.3"]

[project.scripts]
randopt-run = "scripts.run:main"
